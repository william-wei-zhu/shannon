[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shannon-voice"
version = "0.1.0"
description = "Speech-to-text wrapper for Claude Code"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "William Zhu"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["claude", "voice", "speech-to-text", "cli"]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pexpect>=4.8.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/william-wei-zhu/shannon"
Repository = "https://github.com/william-wei-zhu/shannon"

[project.scripts]
shannon = "shannon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shannon*"]
